<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HUAAN GAME LIBRARY</title>
    <link rel="stylesheet" href="css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="lobby-wrapper">
        <header class="main-header">
            <h1 class="library-title">HUAAAN Gamepidia</h1>
        </header>
        
       <div class="game-showcase">
            <a href="stardew/index.html" class="game-card stardew-card">
                <div class="card-bg-img img-stardew" style="background-image: url('./stardew.png');"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <div class="platform-tag">NS / PC</div>
                    <h2 class="game-title">Stardew Valley</h2>
                    <p class="game-desc">Full Guide to Community Center Sacrifice Items & Reward Data</p>
                    <span class="view-btn">Enter</span>

            <a href="./Zelda/index.html" class="game-card zelda-card">
                <div class="card-bg-img img-zelda" style="background-image: url('./zelda.jpg');"></div>
                <div class="card-overlay"></div>
                <div class="card-content">
                    <div class="platform-tag">NS</div>
                    <h2 class="game-title">Zelda: Breath of the Wild</h2>
                    <p class="game-desc">The Legend of Zelda: Breath of the Wild - Full Amiibo Drop Atlas</p>
                    <span class="view-btn">Enter</span>
                </div>
            </a>
        </div>
        
        <footer class="lobby-footer">
            <p>From Idris Dixon / HUAAN</p>
        </footer>
    </div>
